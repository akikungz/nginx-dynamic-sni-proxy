user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # SNI-based routing map
    # Maps incoming SNI hostnames to backend servers
    map $ssl_preread_server_name $backend_name {
        # Example entries (generated from database):
        # Each line maps a hostname to a backend IP:port
        web1.example.com 192.168.1.100:443;  # web1 Instance - HTTPS
        web2.example.com 192.168.1.101:443;  # web2 Instance - HTTPS
        api.example.com 192.168.1.102:8443;  # api Instance - Custom HTTPS Port
        
        # Default backend if no match found
        default 127.0.0.1:8080;
    }

    # Logging format for stream proxy
    log_format proxy '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$ssl_preread_server_name"';
    
    access_log /var/log/nginx/stream-access.log proxy;

    # Main proxy server - uses SNI map for routing
    # Single server block handles all connections using the map variable
    server {
        listen 443;
        proxy_pass $backend_name;
        ssl_preread on;
        proxy_protocol on;
    }
}

# Configuration Details:
# 
# SNI (Server Name Indication):
# - Nginx reads the SNI hostname from incoming TLS connections
# - The $ssl_preread_server_name variable contains the SNI hostname
# - The map block routes traffic based on this hostname
#
# ssl_preread on:
# - Enables SNI reading without terminating SSL
# - Allows traffic to pass through encrypted to the backend
#
# proxy_protocol on:
# - Sends client information to backend servers
# - Backend servers must support PROXY protocol
#
# Backend Configuration:
# - Each backend server must handle SSL termination
# - Backend servers receive the original TLS connection
# - Certificates are managed on backend servers, not the proxy
#
# Testing:
# - Use: openssl s_client -connect <proxy-ip>:443 -servername <hostname>
# - Example: openssl s_client -connect 10.0.0.1:443 -servername web1.example.com
