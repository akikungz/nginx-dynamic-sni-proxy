# Example HAProxy Configuration
# Generated by HAProxy Dynamic Multi-Protocol Proxy

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    # Default SSL material locations
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    retries 3

# HTTPS Frontend with SNI Routing
frontend https_front
    bind *:443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl app1_domain_com_sni req_ssl_sni -i app1.domain.com
    acl app2_domain_com_sni req_ssl_sni -i app2.domain.com
    acl api_domain_com_sni req_ssl_sni -i api.domain.com

    use_backend https_app1_domain_com if app1_domain_com_sni
    use_backend https_app2_domain_com if app2_domain_com_sni
    use_backend https_api_domain_com if api_domain_com_sni

# HTTP Frontend with Host Header Routing
frontend http_front
    bind *:80
    mode http
    option httplog

    acl www_domain_com_host hdr(host) -i www.domain.com
    acl blog_domain_com_host hdr(host) -i blog.domain.com

    use_backend http_www_domain_com if www_domain_com_host
    use_backend http_blog_domain_com if blog_domain_com_host

# HTTPS Backends
backend https_app1_domain_com
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm1 192.168.1.10:443 check maxconn 1000

backend https_app2_domain_com
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm2 192.168.1.11:443 check maxconn 1000

backend https_api_domain_com
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm3 192.168.1.12:8443 check maxconn 2000

# HTTP Backends
backend http_www_domain_com
    mode http
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm1 192.168.1.10:80 check maxconn 1000

backend http_blog_domain_com
    mode http
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm4 192.168.1.13:80 check maxconn 500

# SSH Frontends
frontend ssh_2201_front
    bind *:2201
    mode tcp
    option tcplog
    timeout connect 5s
    default_backend ssh_2201_back

backend ssh_2201_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm1 192.168.1.10:22 check maxconn 100

frontend ssh_2202_front
    bind *:2202
    mode tcp
    option tcplog
    timeout connect 5s
    default_backend ssh_2202_back

backend ssh_2202_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server vm2 192.168.1.11:22 check maxconn 100

# PostgreSQL Frontends
frontend postgresql_5433_front
    bind *:5433
    mode tcp
    option tcplog
    timeout connect 5s
    default_backend postgresql_5433_back

backend postgresql_5433_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server db1 192.168.1.20:5432 check maxconn 200

frontend postgresql_5434_front
    bind *:5434
    mode tcp
    option tcplog
    timeout connect 5s
    default_backend postgresql_5434_back

backend postgresql_5434_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server db2 192.168.1.21:5432 check maxconn 200

# MySQL Frontends
frontend mysql_3307_front
    bind *:3307
    mode tcp
    option tcplog
    timeout connect 5s
    default_backend mysql_3307_back

backend mysql_3307_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server mysql1 192.168.1.30:3306 check maxconn 150

# Redis Frontends
frontend redis_6380_front
    bind *:6380
    mode tcp
    option tcplog
    timeout connect 5s
    default_backend redis_6380_back

backend redis_6380_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 300s
    server redis1 192.168.1.40:6379 check maxconn 1000

# Stats Page
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth admin:changeme
    stats admin if TRUE
